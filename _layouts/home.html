<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | default: "Enrique" }}</title>
    <meta property="og:title" content="{{ page.title | default: site.title | default: 'Enrique' }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/og-image.JPG' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title | default: 'Enrique' }}">
    <meta name="twitter:image" content="{{ '/assets/images/og-image.JPG' | absolute_url }}">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.PNG">
    <style>
      :root {
        color: #000;
        background: #fff;
        font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #fff;
      }

      main {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        padding: clamp(2rem, 8vh, 4.5rem) 1rem 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.75rem, 9vw, 7rem);
        font-weight: 300;
        line-height: 1;
        letter-spacing: 0;
      }

      .home-image {
        display: block;
        width: min(72vw, 340px);
        max-height: min(72vw, 340px);
        margin: clamp(2rem, 6vh, 3.25rem) 0 0.8rem;
        object-fit: contain;
      }

      a {
        color: #000;
        font-size: clamp(1.35rem, 4vw, 2rem);
        font-weight: 300;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.12em;
      }

      a:focus-visible {
        outline: 2px solid #000;
        outline-offset: 0.25rem;
      }

      .home-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem 2rem;
      }

      @media (max-width: 640px) {
        .home-links {
          flex-direction: column;
          align-items: center;
          gap: 0.75rem;
        }
      }

    </style>
  </head>
  <body>
    <main>
      <h1>Enrique</h1>
      <img class="home-image" src="/assets/images/IMG_2825.jpg" alt="Enrique">
      <nav class="home-links" aria-label="Primary">
        <a href="/about/">about</a>
        <a href="/contact/">contact</a>
      </nav>
    </main>
  </body>
</html>
